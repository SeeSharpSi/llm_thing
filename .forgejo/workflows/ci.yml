name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: docker
    container:
      image: node:22.13.0-bookworm
    steps:
      # Runner must provide the docker label.
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run built-bundle smoke test
        run: npm run test:bundle
